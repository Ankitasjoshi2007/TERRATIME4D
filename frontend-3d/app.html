<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERRATIME4D | Planetary Exploration System</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030916;color:#eaf6ff;font-family:Arial,sans-serif;overflow:hidden}
header{height:66px;background:#071426;border-bottom:1px solid #24435e;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:15px;position:relative;z-index:10}
.brand{font-size:20px;font-weight:900;letter-spacing:2px;color:#75e4ff;white-space:nowrap}
nav{display:flex;gap:9px;flex-wrap:wrap}
nav button{background:#10243a;color:#c8eaff;border:1px solid #294d6b;border-radius:7px;padding:11px 17px;cursor:pointer;font-weight:bold}
nav button:hover,nav button.active{background:#075071;border-color:#5be3ff;color:white;box-shadow:0 0 15px #16bce655}
main{height:calc(100vh - 66px);width:100%;position:relative}
iframe{width:100%;height:100%;border:0;background:#030916;display:block}
@media(max-width:750px){header{height:auto;min-height:100px;align-items:flex-start;flex-direction:column;padding:10px}nav button{padding:8px;font-size:12px}main{height:calc(100vh - 100px)}}
</style>
</head>
<body>
<header>
<div class="brand">✦ TERRATIME⁴D</div>
<nav>
<button class="active" data-page="home">01 · GALAXY DASHBOARD</button>
<button data-page="discovery">02 · ANALOGUE DISCOVERY</button>
<button data-page="rover">03 · 4D ROVER MISSIONS</button>
</nav>
</header>
<main>
<iframe id="workspace" src="./index.html" title="TERRATIME4D"></iframe>
</main>
<script>
const frame=document.getElementById("workspace");
const buttons=[...document.querySelectorAll("nav button")];

const pages={
 home:"./index.html",
 discovery:"./comparison.html",
 rover:"./comparison.html#rover4DPanel"
};

function openPage(name){
 buttons.forEach(b=>b.classList.toggle("active",b.dataset.page===name));
 frame.src=pages[name];
 frame.onload=()=>{
   try{
     const doc=frame.contentDocument;
     const innerNav=doc.getElementById("tt4d-global-nav");
     if(innerNav)innerNav.style.display="none";
     if(name==="rover"){
       const panel=doc.getElementById("rover4DPanel");
       if(panel)panel.scrollIntoView({behavior:"instant",block:"start"});
     }
   }catch(e){}
 };
}
buttons.forEach(b=>b.addEventListener("click",()=>openPage(b.dataset.page)));
</script>
</body>
</html>
